<!-- AI Copilot Drawer Component -->
<!-- coss UI Sheet Architecture -->

{% if user.is_authenticated %}
<!-- Floating Copilot Toggle Button (FAB) -->
<button id="copilot-fab" onclick="toggleCopilot()" 
    class="fixed bottom-6 right-6 z-40 size-12 rounded-full bg-primary text-primary-foreground shadow-coss-lg hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 transition-all duration-200 motion-reduce:transition-none flex items-center justify-center cursor-pointer"
    aria-label="Open AI Financial Copilot"
    title="Financial Copilot (Ctrl+K)"
    data-slot="button">
    <svg id="copilot-icon-chat" class="size-5.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/>
    </svg>
    <svg id="copilot-icon-close" class="size-5.5 hidden transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
</button>

<!-- Backdrop Overlay -->
<div id="copilot-backdrop" class="coss-backdrop hidden z-40" onclick="toggleCopilot()" data-slot="backdrop"></div>

<!-- Copilot Sheet Drawer -->
<div id="copilot-drawer" class="coss-sheet-popup right" data-slot="sheet">
    
    <!-- Sheet Header -->
    <div class="coss-sheet-header bg-slate-900 text-white border-b border-slate-800" data-slot="sheet-header">
        <div class="flex items-center gap-2.5">
            <div class="size-7 rounded-lg bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                </svg>
            </div>
            <div>
                <h2 class="text-xs font-bold text-white tracking-tight">Financial Copilot</h2>
                <p class="text-[10px] text-slate-400">Grounded in your statement transactions</p>
            </div>
        </div>
        <div class="flex items-center gap-1">
            <button onclick="clearCopilotHistory()" class="size-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-white cursor-pointer" aria-label="Clear conversation history" title="Clear conversation" data-slot="button">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
            <button onclick="toggleCopilot()" class="size-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-white cursor-pointer" aria-label="Close AI Financial Copilot drawer" title="Close drawer" data-slot="button">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Messages Ledger -->
    <div id="copilot-messages" class="coss-sheet-panel flex-1 overflow-y-auto px-4 py-4 space-y-4" data-slot="sheet-panel">
        <!-- Default Welcome Message -->
        <div class="flex gap-3" id="copilot-welcome">
            <div class="shrink-0 size-7 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 dark:bg-indigo-950/50 dark:border-indigo-900" data-slot="avatar">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                </svg>
            </div>
            <div class="bg-muted/60 border border-border rounded-lg p-3.5 max-w-[88%] shadow-coss-xs" data-slot="card">
                <p class="text-xs text-foreground leading-relaxed">
                    <i class="hgi-stroke hgi-bot mr-1 text-primary"></i> Hello! I'm your <strong>Financial Copilot</strong>. Ask me anything about your uploaded bank statements or choose a preset question:
                </p>
                <div class="mt-3 space-y-1.5">
                    <button onclick="sendSuggestion(this)" class="block w-full text-left text-xs bg-card border border-border rounded-lg px-2.5 py-1.5 hover:border-primary/50 hover:bg-primary/5 transition-colors text-foreground shadow-coss-xs cursor-pointer">
                        <i class="hgi-stroke hgi-money-bag-02 mr-1.5 text-primary"></i><span>"How much did I spend on food and groceries?"</span>
                    </button>
                    <button onclick="sendSuggestion(this)" class="block w-full text-left text-xs bg-card border border-border rounded-lg px-2.5 py-1.5 hover:border-primary/50 hover:bg-primary/5 transition-colors text-foreground shadow-coss-xs cursor-pointer">
                        <i class="hgi-stroke hgi-chart-bar-line mr-1.5 text-primary"></i><span>"What are my total bank charges and SMS fees?"</span>
                    </button>
                    <button onclick="sendSuggestion(this)" class="block w-full text-left text-xs bg-card border border-border rounded-lg px-2.5 py-1.5 hover:border-primary/50 hover:bg-primary/5 transition-colors text-foreground shadow-coss-xs cursor-pointer">
                        <i class="hgi-stroke hgi-search-01 mr-1.5 text-primary"></i><span>"Find all transfers made to OPay or Moniepoint"</span>
                    </button>
                    <button onclick="sendSuggestion(this)" class="block w-full text-left text-xs bg-card border border-border rounded-lg px-2.5 py-1.5 hover:border-primary/50 hover:bg-primary/5 transition-colors text-foreground shadow-coss-xs cursor-pointer">
                        <i class="hgi-stroke hgi-analytics-01 mr-1.5 text-primary"></i><span>"What is my net savings rate and monthly trajectory?"</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="coss-sheet-footer shrink-0 border-t border-border bg-card px-4 py-3" data-slot="sheet-footer">
        <form id="copilot-form" onsubmit="sendCopilotMessage(event)" class="flex items-end gap-2">
            <div class="flex-1 relative">
                <textarea id="copilot-input" 
                    rows="1"
                    placeholder="Ask about spending, transfers, fees..."
                    class="coss-textarea py-2 text-xs"
                    style="max-height: 120px;"
                    onkeydown="handleCopilotKeydown(event)"
                    oninput="autoResizeTextarea(this)"
                    data-slot="textarea"></textarea>
            </div>
            <button type="submit" id="copilot-send" 
                class="coss-button coss-button-primary coss-button-icon shrink-0 shadow-coss-xs"
                aria-label="Send message"
                disabled
                data-slot="button">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
                </svg>
            </button>
        </form>
        <p class="text-[10px] text-muted-foreground mt-1 text-center">
            Press <kbd class="coss-kbd text-[9px]">Enter</kbd> to send • <kbd class="coss-kbd text-[9px]">Shift+Enter</kbd> for newline
        </p>
    </div>
</div>

<script>
let copilotOpen = false;
let copilotLoading = false;
const csrfToken = '{{ csrf_token }}';

function toggleCopilot() {
    copilotOpen = !copilotOpen;
    const drawer = document.getElementById('copilot-drawer');
    const fab = document.getElementById('copilot-fab');
    const iconChat = document.getElementById('copilot-icon-chat');
    const iconClose = document.getElementById('copilot-icon-close');
    const backdrop = document.getElementById('copilot-backdrop');

    if (copilotOpen) {
        drawer.classList.remove('translate-x-full');
        drawer.classList.add('open');
        iconChat.classList.add('hidden');
        iconClose.classList.remove('hidden');
        backdrop.classList.remove('hidden');
        fab.setAttribute('aria-label', 'Close AI Financial Copilot');
        document.getElementById('copilot-input').focus();
    } else {
        drawer.classList.remove('open');
        drawer.classList.add('translate-x-full');
        iconChat.classList.remove('hidden');
        iconClose.classList.add('hidden');
        backdrop.classList.add('hidden');
        fab.setAttribute('aria-label', 'Open AI Financial Copilot');
    }
}

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    document.getElementById('copilot-send').disabled = !el.value.trim();
}

function handleCopilotKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCopilotMessage(e);
    }
}

function sendSuggestion(btn) {
    const span = btn.querySelector('span');
    const text = (span ? span.textContent : btn.textContent).replace(/^"|"$/g, '').trim();
    document.getElementById('copilot-input').value = text;
    autoResizeTextarea(document.getElementById('copilot-input'));
    sendCopilotMessage(new Event('submit'));
}

async function sendCopilotMessage(e) {
    e.preventDefault();
    const input = document.getElementById('copilot-input');
    const message = input.value.trim();
    if (!message || copilotLoading) return;

    const welcome = document.getElementById('copilot-welcome');
    if (welcome) welcome.remove();

    appendMessage('user', message);
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('copilot-send').disabled = true;

    copilotLoading = true;
    const typingId = showTypingIndicator();

    try {
        const response = await fetch('/api/copilot/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
            },
            body: JSON.stringify({ message }),
        });

        const data = await response.json();
        removeTypingIndicator(typingId);

        if (!response.ok && response.status === 429) {
            appendMessage('assistant', `<i class="hgi-stroke hgi-alert-circle text-amber-500 mr-1"></i> ` + (data.error || 'Rate limit reached. Please wait a few seconds before asking another question.'));
        } else if (data.error && !data.answer) {
            appendMessage('assistant', `<i class="hgi-stroke hgi-alert-circle text-amber-500 mr-1"></i> ` + data.error);
        } else {
            appendMessage('assistant', data.answer, data.tool_calls_made);
        }
    } catch (err) {
        removeTypingIndicator(typingId);
        appendMessage('assistant', `<i class="hgi-stroke hgi-cancel-circle text-rose-500 mr-1"></i> Network error. Please verify your connection.`);
    }

    copilotLoading = false;
}

function appendMessage(role, content, toolCalls) {
    const container = document.getElementById('copilot-messages');
    const wrapper = document.createElement('div');
    wrapper.className = 'flex gap-2.5' + (role === 'user' ? ' flex-row-reverse' : '');

    if (role === 'assistant') {
        wrapper.innerHTML = `
            <div class="shrink-0 size-7 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 dark:bg-indigo-950/50 dark:border-indigo-900">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                </svg>
            </div>
            <div class="bg-muted/60 border border-border rounded-lg p-3 max-w-[88%] shadow-coss-xs">
                ${toolCalls && toolCalls.length ? '<div class="flex flex-wrap gap-1 mb-2">' + toolCalls.map(t => `<span class="inline-flex items-center text-[9px] px-1.5 py-0.5 rounded bg-primary/10 text-primary border border-primary/20 font-mono"><i class="hgi-stroke hgi-wrench-01 mr-1"></i> ${t.tool}</span>`).join('') + '</div>' : ''}
                <div class="text-xs text-foreground leading-relaxed copilot-markdown">${formatMarkdown(content)}</div>
            </div>
        `;
    } else {
        wrapper.innerHTML = `
            <div class="bg-primary text-primary-foreground rounded-lg px-3.5 py-2.5 max-w-[85%] shadow-coss-xs">
                <p class="text-xs leading-relaxed">${escapeHtml(content)}</p>
            </div>
        `;
    }

    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
}

let typingCounter = 0;
function showTypingIndicator() {
    const id = 'typing-' + (++typingCounter);
    const container = document.getElementById('copilot-messages');
    const div = document.createElement('div');
    div.id = id;
    div.className = 'flex gap-2.5';
    div.innerHTML = `
        <div class="shrink-0 size-7 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 dark:bg-indigo-950/50 dark:border-indigo-900">
            <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
            </svg>
        </div>
        <div class="bg-muted/60 border border-border rounded-lg p-2.5">
            <div class="flex items-center gap-1">
                <div class="size-1.5 rounded-full bg-muted-foreground/60 animate-pulse"></div>
                <div class="size-1.5 rounded-full bg-muted-foreground/60 animate-pulse" style="animation-delay: 150ms"></div>
                <div class="size-1.5 rounded-full bg-muted-foreground/60 animate-pulse" style="animation-delay: 300ms"></div>
            </div>
        </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
}

function removeTypingIndicator(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

async function clearCopilotHistory() {
    try {
        await fetch('/api/copilot/clear/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
            },
            body: JSON.stringify({}),
        });
    } catch (e) { }

    const container = document.getElementById('copilot-messages');
    container.innerHTML = `
        <div class="flex gap-3" id="copilot-welcome">
            <div class="shrink-0 size-7 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 dark:bg-indigo-950/50 dark:border-indigo-900">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                </svg>
            </div>
            <div class="bg-muted/60 border border-border rounded-lg p-3 max-w-[88%]">
                <p class="text-xs text-foreground leading-relaxed">
                    <i class="hgi-stroke hgi-checkmark-circle-02 text-emerald-500 mr-1"></i> Conversation cleared. Feel free to ask another question about your statement!
                </p>
            </div>
        </div>
    `;
}

function formatMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-slate-900 text-slate-100 rounded-lg p-2.5 my-2 text-[11px] overflow-x-auto font-mono"><code>$1</code></pre>');
    html = html.replace(/`(.*?)`/g, '<code class="bg-gray-200 px-1 py-0.5 rounded text-[11px] text-gray-800 font-mono">$1</code>');
    html = html.replace(/₦([\d,]+\.?\d*)/g, '<span class="font-bold text-emerald-700 tabular-nums">₦$1</span>');
    html = html.replace(/^[-•]\s+(.+)/gm, '<li class="ml-3 list-disc">$1</li>');
    html = html.replace(/^\d+\.\s+(.+)/gm, '<li class="ml-3 list-decimal">$1</li>');
    html = html.replace(/^### (.+)/gm, '<h4 class="font-bold text-gray-900 mt-2 mb-0.5">$1</h4>');
    html = html.replace(/^## (.+)/gm, '<h3 class="font-bold text-gray-900 mt-2.5 mb-1">$1</h3>');
    html = html.replace(/\n/g, '<br>');
    
    return html;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

<style>
    .copilot-markdown li + li { margin-top: 0.2rem; }
    .copilot-markdown table { font-size: 0.75rem; border-collapse: collapse; width: 100%; margin: 0.4rem 0; }
    .copilot-markdown th, .copilot-markdown td { border: 1px solid #e5e7eb; padding: 0.25rem 0.4rem; text-align: left; }
    .copilot-markdown th { background: #f9fafb; font-weight: 600; }
    
    #copilot-messages::-webkit-scrollbar { width: 3px; }
    #copilot-messages::-webkit-scrollbar-track { background: transparent; }
    #copilot-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
</style>
{% endif %}
