{% extends 'base.html' %}

{% block title %}Password Reset Complete - Bank Statement Analyzer{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full coss-frame text-center p-8 space-y-5 shadow-coss-md" data-slot="frame">
        <div class="mx-auto flex items-center justify-center size-12 rounded-full bg-success/10 border border-success/30 text-success shadow-coss-xs" data-slot="avatar">
            <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-xl font-bold text-foreground tracking-tight">Password Reset Successful</h1>
        <p class="text-xs text-muted-foreground leading-relaxed text-pretty">
            Your credentials have been safely updated. You can now log into your account.
        </p>
        <div class="pt-2">
            <a href="{% url 'login' %}" class="coss-button coss-button-primary shadow-coss-xs" data-slot="button">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
