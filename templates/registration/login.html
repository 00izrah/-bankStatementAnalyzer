{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Bank Statement Analyzer{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full coss-frame shadow-coss-md" data-slot="frame">
        <div class="p-8 space-y-6">
            <div class="text-center">
                <div class="coss-icon-tile size-10 rounded-xl bg-primary text-primary-foreground mx-auto mb-3 shadow-coss-xs" data-slot="avatar">
                    <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-foreground tracking-tight">Sign in to your account</h1>
                <p class="mt-1 text-xs text-muted-foreground">
                    Or <a href="{% url 'register' %}" class="font-semibold text-primary hover:underline">create a new account</a>
                </p>
            </div>

            <form class="space-y-4" method="post">
                {% csrf_token %}
                <div>
                    {{ form|crispy }}
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox" class="size-4 text-primary focus:ring-ring border-input rounded">
                        <label for="remember_me" class="ml-2 block text-foreground font-medium">
                            Remember me
                        </label>
                    </div>

                    <div>
                        <a href="{% url 'password_reset' %}" class="font-medium text-primary hover:underline">
                            Forgot password?
                        </a>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="coss-button coss-button-primary w-full shadow-coss-sm" data-slot="button">
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
